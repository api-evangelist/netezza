aid: netezza
name: Netezza
description: >-
  IBM Netezza Performance Server is a cloud-native data warehouse and analytics
  appliance for running large-scale SQL analytics and in-database machine
  learning on structured data. Originally a standalone data-warehouse appliance
  vendor acquired by IBM, Netezza is now delivered as Netezza Performance Server
  on IBM Cloud, AWS, and Microsoft Azure and as part of IBM Cloud Pak for Data.
  It is consumed primarily through SQL over standard database connectivity —
  the pure-Python nzpy DB-API 2.0 driver, JDBC (nzjdbc) and ODBC drivers, and
  the nzpyida in-database analytics library — rather than as a public REST API,
  with a REST interface for backup/restore administration and a web console for
  monitoring and administration.
